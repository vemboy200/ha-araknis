name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install requirements
        run: pip install ruff

      - name: Check
        run: ruff check .

      - name: Format
        run: ruff format --check .
