rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: |
      No requirements. The device clients live in api.py, which has no Home
      Assistant imports so it can move into its own PyPI library later.
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities get their data from the coordinator and subscribe to nothing.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: todo
  discovery-update-info:
    status: done
    comment: |
      Switches: SSDP updates the host of a known switch, matched by the MAC in
      its UDN. Routers: their mDNS advertisement carries no MAC or other ID,
      so a router that moved to a new address can't be matched to its entry.
  discovery: done
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: |
      The child devices are the switch's PoE ports and the router's WAN
      ports, which are fixed by the hardware model.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: todo
  repair-issues:
    status: exempt
    comment: |
      The only problem a user has to fix is a rejected login, which the
      reauthentication flow covers.
  stale-devices:
    status: exempt
    comment: |
      The child devices are the switch's PoE ports and the router's WAN
      ports, which are fixed by the hardware model.

  # Platinum
  async-dependency:
    status: done
    comment: The clients in api.py use aiohttp.
  inject-websession: done
  strict-typing: todo
