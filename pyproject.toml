[project]
name = "ha-araknis"
version = "0.1.0"
description = "Home Assistant custom integration for Araknis PoE switches"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
